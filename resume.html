<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">


    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }
        iframe {
            width: 70%;
            height: 80vh;
            border: none;
        }
        .download-button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }

        .download-button:hover {
            background-color: #0056b3;
        }
        footer {
            color: white;
            text-align: center;
            padding: 10px 20px;
            font-size: .9em;
        }
        footer a {
            color: #00c6ff;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="content">
    <iframe src="resume.pdf" width="80%" height="780px"></iframe>
    <a href="resume.pdf" download class="download-button">Download PDF</a>
</div>

<!-- Footer info -->
<footer>
    <div class="footer-content">
        <p>© 2026. All Rights Reserved.</p>
        <p>
            <a href="index.html">Home</a> |
            <a href="https://www.linkedin.com/in/philip-thakuri/" target="_blank">LinkedIn</a> |
            <a href="https://github.com/philtki" target="_blank">GitHub</a>
        </p>
    </div>
</footer>
</body>
</html>
